[pytest]
# If a pytest section is found in one of the possible config files
# (pytest.ini, tox.ini or setup.cfg), then pytest will not look for any others,
# so if you add a pytest config section elsewhere,
# you will need to delete this section from setup.cfg.
norecursedirs =
    migrations
    # Auto-generated scripts under `tests/docs/scripts/` are meant to be run
    # in fresh subprocesses by `tests/test_docs_code_blocks.py`, not imported
    # by `--doctest-modules`. Importing them triggers module-body side
    # effects (model runs, `plt.show()`, etc.) that have no place in
    # collection. The extractor regenerates them on every harness run.
    tests/docs/scripts

python_files =
    test_*.py
    *_test.py
    tests.py
addopts =
    -ra
    --strict-markers
    --doctest-modules
    --doctest-glob=\*.md
    --tb=short
testpaths =
    tests
# If you want to switch back to tests outside package just remove --pyargs
# and edit testpaths to have "tests/" instead of "laser.cholera".

# Idea from: https://til.simonwillison.net/pytest/treat-warnings-as-errors
filterwarnings =
    error
# You can add exclusions, some examples:
#    ignore:'laser.cholera' defines default_app_config:PendingDeprecationWarning::
#    ignore:The {{% if:::
#    ignore:Coverage disabled via --no-cov switch!
