[testenv:bootstrap]
deps =
    jinja2
    tox
skip_install = true
commands =
    python ci/bootstrap.py --no-env
passenv =
    *

; a generative tox configuration, see: https://tox.wiki/en/latest/user_guide.html#generative-environments
[tox]
envlist =
    clean,
    check,
    docs,
;    {py310,py311,py312,py313},
    py312,
    report
ignore_basepython_conflict = true

[testenv]
basepython =
;    py310: {env:TOXPYTHON:python3.10}
;    py311: {env:TOXPYTHON:python3.11}
    py312: {env:TOXPYTHON:python3.12}
;    py313: {env:TOXPYTHON:python3.13}
;    py314: {env:TOXPYTHON:python3.14}
    {bootstrap,clean,check,report,docs,codecov}: {env:TOXPYTHON:python3.12}
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes
    cover: SETUPPY_EXT_COVERAGE=yes
passenv =
    *
usedevelop = false
deps =
    pytest
    pytest-cov
    setuptools
commands =
    {posargs:pytest --cov --cov-report=term-missing --cov-report=xml -vv tests}

[testenv:check]
deps =
    docutils
    check-manifest
    pre-commit
    readme-renderer
    pygments
    isort
skip_install = true
commands =
    pre-commit autoupdate
    pre-commit run --all-files --show-diff-on-failure

[testenv:docs]
usedevelop = true
extras =
    docs
deps =
    pytest
setenv =
    DISABLE_MKDOCS_2_WARNING = true
commands =
    # 1. Build the MkDocs (ProperDocs) site. Reference pages are
    #    autogenerated by mkdocs-gen-files (see docs/_gen_reference.py),
    #    replacing the previous sphinx-apidoc step.
    properdocs build -f mkdocs.yml {posargs}
    # 2. Run doctests under docs/. pytest.ini's `--doctest-glob=*.md`
    #    and `--doctest-modules` addopts apply here, but its
    #    `testpaths = tests` pins the default discovery to tests/, so
    #    we point pytest at docs/ explicitly to pick up the runnable
    #    examples in docs/usage.md (and any future .md doctests).
    pytest docs/

[testenv:report]
deps =
    coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
skip_install = true
deps =
    coverage
commands =
    coverage erase
