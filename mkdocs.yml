site_name: LASER Cholera (LASIK)
site_description: LASER-based Simulation of Cholera — Python port of the upstream R MOSAIC reference.
site_url: https://InstituteforDiseaseModeling.github.io/laser-cholera/
repo_url: https://github.com/InstituteforDiseaseModeling/laser-cholera
repo_name: laser-cholera
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/_gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Allow `--8<-- "CHANGELOG.md"` to resolve files at the repo root,
      # so docs/changelog.md / docs/authors.md / docs/contributing.md can
      # snippet-include the canonical root-level Markdown files instead
      # of duplicating their content.
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  # MathJax for arithmatex (generic mode).
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Files in docs/ that should NOT end up in the built site.
exclude_docs: |
  requirements.txt
  _gen_reference.py
  __pycache__/*

# The literate-nav plugin pulls the reference/ subtree from the
# SUMMARY.md generated by docs/_gen_reference.py; everything else is
# hand-listed here.
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Contributing: contributing.md
  - Authors: authors.md
  - Changelog: changelog.md
  - API reference: reference/
