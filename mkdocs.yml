site_name: LASER Cholera (LASIK)
site_description: LASER-based Simulation of Cholera — Python port of the upstream R MOSAIC reference.
site_url: https://InstituteforDiseaseModeling.github.io/laser-cholera/
repo_url: https://github.com/InstituteforDiseaseModeling/laser-cholera
repo_name: laser-cholera
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/_gen_reference.py
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Allow `--8<-- "CHANGELOG.md"` to resolve files at the repo root,
      # so docs/changelog.md / docs/authors.md / docs/contributing.md can
      # snippet-include the canonical root-level Markdown files instead
      # of duplicating their content.
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  # MathJax for arithmatex (generic mode).
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Files in docs/ that should NOT end up in the built site.
exclude_docs: |
  requirements.txt
  _gen_reference.py
  __pycache__/*

# Explicit Diátaxis-shaped nav. The four quadrants (Tutorials / How-to /
# Reference / Explanation) are the top-level entry points; Configurations
# ride alongside them. The API reference subtree is generated by
# docs/_gen_reference.py via the gen-files plugin but listed by hand here
# (literate-nav has been retired).
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Tutorials:
      - First run: tutorials/first-run.md
      - Single location: tutorials/single-location.md
      - Multi-location country: tutorials/multi-location-country.md
  - How-to:
      - Override parameters: how-to/override-parameters.md
      - Enable vaccination: how-to/enable-vaccination.md
      - Configure mobility: how-to/configure-mobility.md
      - Enable seasonality: how-to/enable-seasonality.md
      - Calibrate and score: how-to/calibrate-and-score.md
      - Interoperate with MOSAIC: how-to/interoperate-with-mosaic.md
  - Reference:
      - Parameters:
          - Overview: reference/parameters/index.md
          - Run identity and calendar: reference/parameters/run-identity.md
          - Initial populations: reference/parameters/initial-populations.md
          - Vital dynamics: reference/parameters/vital-dynamics.md
          - Vaccination: reference/parameters/vaccination.md
          - Disease progression: reference/parameters/disease-progression.md
          - Reporting: reference/parameters/reporting.md
          - Regime switching: reference/parameters/regime-switching.md
          - Geography and mobility: reference/parameters/geography-and-mobility.md
          - Human-to-human transmission: reference/parameters/human-transmission.md
          - Environmental transmission: reference/parameters/environmental-transmission.md
      - API reference:
          - Overview: reference/index.md
          - calc_log_likelihood_distributions: reference/calc_log_likelihood_distributions.md
          - calc_model_likelihood: reference/calc_model_likelihood.md
          - core: reference/core.md
          - iso_codes: reference/iso_codes.md
          - utils: reference/utils.md
          - metapop:
              - Overview: reference/metapop/index.md
              - analyzer: reference/metapop/analyzer.md
              - census: reference/metapop/census.md
              - derivedvalues: reference/metapop/derivedvalues.md
              - environmental: reference/metapop/environmental.md
              - envtohuman: reference/metapop/envtohuman.md
              - exposed: reference/metapop/exposed.md
              - humantohuman: reference/metapop/humantohuman.md
              - infectious: reference/metapop/infectious.md
              - logsetup: reference/metapop/logsetup.md
              - model: reference/metapop/model.md
              - params: reference/metapop/params.md
              - recorder: reference/metapop/recorder.md
              - recovered: reference/metapop/recovered.md
              - scenario: reference/metapop/scenario.md
              - susceptible: reference/metapop/susceptible.md
              - utils: reference/metapop/utils.md
              - vaccinated: reference/metapop/vaccinated.md
  - Explanation:
      - Model overview: explanation/model-overview.md
      - Transmission: explanation/transmission.md
      - Seasonality: explanation/seasonality.md
      - Mobility: explanation/mobility.md
      - Reporting and likelihood: explanation/reporting-and-likelihood.md
  - Configurations:
      - Single location: configurations/single-location.md
      - Multi-admin: configurations/multi-admin.md
      - SSA baseline: configurations/ssa-baseline.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - Authors: authors.md
