name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow-level default: minimum every job needs. Each job tightens or
# widens this with its own `permissions:` block. In particular, the
# elevated `pages: write` and `id-token: write` are NOT granted here —
# they would otherwise apply to the `build` job (and to PR-triggered
# builds), which has no business holding either. They're scoped to the
# `deploy` job only, below.
permissions:
  contents: read

# Allow one concurrent deployment per ref. Don't cancel in-flight deploys —
# losing a successful upload mid-flight could leave Pages in a half-deployed
# state.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Build only needs to checkout the repo and upload an artifact;
    # `actions/upload-pages-artifact@v3` does not require pages:write
    # (that permission is enforced at deploy time, not at artifact-upload).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 lets mkdocs-material's git-revision-date plugin
          # (if enabled later) read commit timestamps. Cheap enough on a
          # small repo to enable unconditionally.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Build the MkDocs site
        # `uv run --extra docs` resolves the project + the [docs] optional
        # dependencies (properdocs, mkdocs-material, mkdocstrings, etc.)
        # into a managed venv and invokes properdocs from inside it. That
        # is why we do NOT use `uvx properdocs ...` here: uvx runs in an
        # isolated one-shot env that has properdocs but none of its
        # plugins, and no access to `laser.cholera` for mkdocstrings to
        # import.
        #
        # `--strict` is intentionally NOT used until the known cross-ref
        # warnings tracked in doc-conversion.md are resolved.
        run: uv run --extra docs properdocs build -f mkdocs.yml

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Elevated permissions live here, scoped to the deploy step only.
    # `actions/deploy-pages@v4` needs pages:write to publish to GitHub
    # Pages and id-token:write to mint the OIDC attestation token; it
    # does not need contents:read since it fetches the artifact via the
    # GitHub API rather than checking out the repo.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
